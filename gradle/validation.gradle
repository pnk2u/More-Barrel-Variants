// Validation tasks for build integrity and consistency

tasks.register("validateModId") {
	def modInitializerFile = file("src/main/java/${mod_group_id.replace('.', '/')}/${archives_base_name}.java")
	doLast {
		if (!modInitializerFile.exists()) {throw new GradleException("File not found: ${modInitializerFile}")}

		def text = modInitializerFile.text
		def matcher = text =~ /(?i)(MOD_ID|MODID)\s*=\s*"([^"]+)"/
		if (!matcher.find()) {throw new GradleException("Could not find any Mod ID declaration in ${modInitializerFile}")}

		def initializerModId = matcher.group(2); def configuredModId = "${mod_id}"

		if (initializerModId != configuredModId) {throw new GradleException("Mod ID mismatch: Mod Initializer has '${initializerModId}', gradle.properties has '${configuredModId}'")}
		if (!initializerModId.matches("[a-z0-9_-]+")) {throw new GradleException("Invalid Mod ID '${initializerModId}' in ${modInitializerFile}: must only contain lowercase letters, numbers, underscores, or hyphens (allowed in Fabric, avoid for NeoForge compatibility)")}
		if (initializerModId.length() > 64) {throw new GradleException("Mod ID '${initializerModId}' in ${modInitializerFile} is too long: must be 64 characters or fewer.")}
		if (initializerModId.contains("-")) {println("Warning: Mod ID '${initializerModId}' in ${modInitializerFile} contains hyphens, which are allowed in Fabric but not in NeoForge. Consider replacing with underscores for better compatibility.")}
		println("Mod ID check passed: ${initializerModId}")
	}
}

tasks.named("compileJava") {
	dependsOn(tasks.named("validateModId"))
}


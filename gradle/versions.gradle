import groovy.json.JsonSlurper
import groovy.xml.XmlSlurper

def getReleaseVersion(minecraftVersion) {
	// Truncate version after first non-integer/dot
	def releaseVersion = minecraftVersion.replaceAll(/[^0-9.].*/, '')
	if (minecraftVersion != releaseVersion) {
		println('===')
		println('Resolved "' + minecraftVersion + '" as "' + releaseVersion + '" for Fabric.')
		println('===')
	}
	return releaseVersion
}

def releaseVersion = getReleaseVersion(project.minecraft_version)

def getLatestFabric(minecraftVersion) {
	def fApiXmlUrl = 'https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml'
	def fLoaderJsonUrl = 'https://meta.fabricmc.net/v2/versions/loader'

	def fLoaderJson = new JsonSlurper().parseText(new URI(fLoaderJsonUrl).toURL().text)
	def fLoaderLatestVersion = fLoaderJson.get(0).version
	println('Fabric Loader: ' + fLoaderLatestVersion)

	def fApiLatestVersion
	try {
		def metadata = new XmlSlurper().parse(fApiXmlUrl)
		def versions = metadata.versioning.versions.version*.text()
		fApiLatestVersion = versions.findAll { it ==~ /\d+(\.\d+)*.${minecraftVersion}/ }.last()
		println('Fabric Api: ' + fApiLatestVersion)
	} catch (Exception e) {
		throw new GradleException("Failed to fetch $fApiXmlUrl: ${e.message}")
	}
	return [fLoaderLatestVersion, fApiLatestVersion]
}

def (fabric_loader_version, fabric_api_version) = getLatestFabric(releaseVersion)

static def version_reduced(String input) { // Reduces a version string by one minor version and sets patch to 0
	def parts = input.split('\\.')
	if (parts.length < 2) throw new IllegalArgumentException("Invalid version: $input")
	def major = parts[0] as Integer
	def minor = (parts[1] as Integer) - 1
	return "${major}.${minor}.0"
}

def minecraft_version_0() {
	String key = 'minecraft_version_lower'
	if (project.hasProperty(key)) {
		String value = project.getProperties().get(key)
		return !value.isEmpty() ? value : version_reduced("${project.minecraft_version}")
	} else {
		return version_reduced("${project.minecraft_version}") // Default to one minor version lower with patch = 0 as lower bound if none is specified
	}
}

def minecraft_version_1() {
	String key = 'minecraft_version_upper'
	if (project.hasProperty(key)) {
		String value = project.getProperties().get(key)
		return !value.isEmpty() ? value : "99.0.0"
	} else {
		return "99.0.0" // Effectively no upper bound
	}
}

def getJavaVersionNum() {
	if (project.minecraft_version.startsWith("1.20")) {
		return 17
	} else if (project.minecraft_version.startsWith("1.21")) {
		return 21
	} else {
		return 25
	}
}

def getJavaVersionEnum() {
	if (project.minecraft_version.startsWith("1.20")) {
		return JavaVersion.VERSION_17
	} else if (project.minecraft_version.startsWith("1.21")) {
		return JavaVersion.VERSION_21
	} else {
		return JavaVersion.VERSION_25
	}
}

def java_version = getJavaVersionNum()
def java_version_enum = getJavaVersionEnum()

// Export variables for use in build.gradle
ext.releaseVersion = releaseVersion
ext.fabric_loader_version = fabric_loader_version
ext.fabric_api_version = fabric_api_version
ext.java_version = java_version
ext.java_version_enum = java_version_enum
ext.version_reduced = this.&version_reduced
ext.minecraft_version_0 = this.&minecraft_version_0
ext.minecraft_version_1 = this.&minecraft_version_1



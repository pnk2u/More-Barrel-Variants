plugins {
	id 'net.fabricmc.fabric-loom' // version from latest-loom.gradle via settings.gradle's pluginManagement
	id 'maven-publish'
}

apply from: "gradle/versions.gradle"
apply from: "gradle/validation.gradle"

def mc_version_name(){
	String key = 'minecraft_version_name'
	if (project.hasProperty(key)) {String value = project.getProperties().get(key); return !value.isEmpty() ? value : project.minecraft_version}
	else {return project.minecraft_version}
}
version = "${mod_version}+${mc_version_name()}-Fabric"
group = project.mod_group_id

base {
	archivesName = archives_base_name
}

repositories {
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
	}
	maven {
		name = 'SomethingSketchy' // EveryCompat, Moonlight
		url = "https://registry.somethingcatchy.net/repository/maven-releases/"
	}
}


loom {
	accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}


dependencies {
	implementation 'org.apache.commons:commons-text:1.12.0'
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

	// Compatibility with Every Compat ("everycomp" modid, slug for maven with docs - "MehVahdJukaar/WoodGood" repo - "every-compat" slug mr/cf)
		//runtimeOnly modCompileOnly("net.mehvahdjukaar:moonlight-fabric:${moonlight_version}:fabric") { transitive = false }
		//runtimeOnly modCompileOnly("net.mehvahdjukaar:everycomp-fabric:${every_compat_version}:fabric") { transitive = false }
		// Above for docs, if needed - below in case above's maven is down
					   //modCompileOnly("maven.modrinth:moonlight:${moonlight_version}-fabric")
					   //modCompileOnly("maven.modrinth:every-compat:${every_compat_version}-fabric")
		// Testing
		//runtimeOnly("maven.modrinth:wilder-wild:${wilder_wild_version}-mc${project.minecraft_version}")
			//runtimeOnly("maven.modrinth:frozenlib:${frozen_lib_version}-mc${project.minecraft_version}")
}


processResources {
	var fabric_loader_version_0 = version_reduced(fabric_loader_version)

	var replaceProperties = [
			loader_version: fabric_loader_version_0, mod_id: mod_id, mod_name: mod_name,
			mod_license: mod_license, mod_version: mod_version, mod_description: mod_description,
			minecraft_version: minecraft_version, minecraft_version_0: minecraft_version_0(), minecraft_version_1: minecraft_version_1(),
			java_version: java_version
	]
	inputs.properties replaceProperties

	filesMatching("fabric.mod.json") {
		expand replaceProperties
	}
	filesMatching("*.mixins.json") {
		expand replaceProperties
	}
}


tasks.withType(JavaCompile).configureEach {
	it.options.release = java_version
}

java {
	sourceCompatibility = java_version_enum
	targetCompatibility = java_version_enum
}

jar {
	from("LICENSE") {
		rename { "${project.base.archivesName.get()}_${it}"}
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
	repositories {}
}
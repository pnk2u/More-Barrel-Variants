buildscript {
	repositories {maven {url = 'https://maven.fabricmc.net/'}}
	apply from: "versions.gradle"
	def (loomGroupId, loomArtifactId, loomVersion, loomBaseId) = getFabricLoom(project.minecraft_version)
	def minecraftRelease = getMinecraftReleaseVersion(minecraft_version)
	def (fabricLoaderVersion, minFabricLoaderVersion, fabricApiVersion) = getLatestFabricVersions(minecraftRelease)
	def (minMinecraftVersionExcl, maxMinecraftVersionExcl) = getMinecraftVersionExclRange(minecraft_version_min_excl, minecraft_version_max_excl)
	def (javaVersionNum, javaVersionEnum) = getJavaVersions(minecraftRelease)
	dependencies {
		classpath "$loomGroupId:$loomArtifactId:$loomVersion"
	}
	ext {
		ext.loomPluginBaseId = loomBaseId
		ext.minecraftRelease = minecraftRelease
		ext.fabricLoaderVersion = fabricLoaderVersion
		ext.minFabricLoaderVersion = minFabricLoaderVersion
		ext.fabricApiVersion = fabricApiVersion
		ext.minMinecraftVersionExcl = minMinecraftVersionExcl
		ext.maxMinecraftVersionExcl = maxMinecraftVersionExcl
		ext.javaVersionNum = javaVersionNum
		ext.javaVersionEnum = javaVersionEnum
	}
}
plugins {
	id 'dev.isxander.mtk.modrepos'
}

apply plugin: "${loomPluginBaseId}"
apply from: "versions.gradle"
apply plugin: "dev.isxander.mtk.modrepos"

def getMinecraftVersionName(){
	String key = 'minecraft_version_name'
	if (project.hasProperty(key)) {String value = project.getProperties().get(key); return !value.isEmpty() ? value : project.minecraft_version}
	else {return project.minecraft_version}
}
version = "${mod_version}+${getMinecraftVersionName()}-Fabric"
group = project.group_id

base {
	archivesName = project.archives_base_name
}

repositories {
	modrinthApi.exclusive()
	maven {
		name = 'SomethingSketchy' // EveryCompat, Moonlight
		url = "https://registry.somethingcatchy.net/repository/maven-releases/"
	}
}

loom {
	accessWidenerPath = file("src/main/resources/${mod_id}.classtweaker")
	log4jConfigs.from(file("log4j.xml"))
}

dependencies {
	implementation 'org.apache.commons:commons-text:1.12.0'
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${fabricLoaderVersion}"
	implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

	// Compatibility with Every Compat ("everycomp" modid, slug for maven with docs - "MehVahdJukaar/WoodGood" repo - "every-compat" slug mr/cf)
		//runtimeOnly modCompileOnly("net.mehvahdjukaar:moonlight-fabric:${moonlight_version}:fabric") { transitive = false }
		//runtimeOnly modCompileOnly("net.mehvahdjukaar:everycomp-fabric:${every_compat_version}:fabric") { transitive = false }
		// Above for docs, if needed - below in case above's maven is down
					   //modCompileOnly("maven.modrinth:moonlight:${moonlight_version}-fabric")
					   //modCompileOnly("maven.modrinth:every-compat:${every_compat_version}-fabric")
		// Testing
		//runtimeOnly("maven.modrinth:wilder-wild:${wilder_wild_version}-mc${project.minecraft_version}")
			//runtimeOnly("maven.modrinth:frozenlib:${frozen_lib_version}-mc${project.minecraft_version}")
}

def replaceProperties = [
		project_name: project.name, archives_base_name: archives_base_name, group_id: group_id,
		mod_id: mod_id, mod_name: mod_name, mod_description: mod_description, mod_license: mod_license,
		mod_version: mod_version,
		minFabricLoaderVersion: minFabricLoaderVersion,
		minMinecraftVersionExcl: minMinecraftVersionExcl, maxMinecraftVersionExcl: maxMinecraftVersionExcl, javaVersion: javaVersionNum,
		modrinth_project_id: modrinth_project_id, curseforge_project_id: curseforge_project_id
]
println "===\nExpanding the following values into fabric.mod.json and *.mixins.json:\n${replaceProperties.collect { k, v -> "  ${k}: ${v}" }.join('\n')}\n==="


["processResources"].each { taskName ->
	tasks.named(taskName) {
		inputs.properties replaceProperties

		filesMatching("fabric.mod.json") {
			expand replaceProperties
		}
		filesMatching("*.mixins.json") {
			expand replaceProperties
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaVersionNum
}

java {
	sourceCompatibility = javaVersionEnum
	targetCompatibility = javaVersionEnum
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}